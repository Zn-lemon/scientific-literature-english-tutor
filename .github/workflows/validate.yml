name: Validate Skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run structural regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and verify Skill archive
        run: python tools/package_skill.py --output dist/scientific-literature-english-tutor.skill --verify
